name: Hello

on:
  pull_request:
  workflow_dispatch:

jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Hello ${{ github.actor}}!"
  review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "reviewing $PR_TITLE"
