name: Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_ACCOUNT_ID: "427047664719"
  AWS_REGION: us-east-1
  S3_BUCKET: my-frontend-app-assets-1
  SITE_URL: d26gkersxsxx1f.cloudfront.net
  CLOUDFRONT_DISTRIBUTION_ID: E9NDK1GEGISTX

jobs:
  ci:
    name: ci
    uses: ./.github/workflows/ci.yaml

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ci]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.CLOUDFRONT_URL }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          name: build
          path: dist
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: gha-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Show machine identity
        run: aws sts get-caller-identity

      - name: Publish release with explicit cache metadata
        env:
          SITE_DIR: dist
        run: |
          set -euo pipefail

          # Mutable entry point: same URL, new release -> must revalidate every request.
          aws s3 cp "$SITE_DIR/" "s3://$S3_BUCKET/" \
            --recursive \
            --exclude "*" \
            --include "*.html" \
            --cache-control "public,max-age=0,s-maxage=0,must-revalidate"

          if test -d "$SITE_DIR/assets"; then
            # Vite fingerprint contract: <name>-<8+ base64 hash>.<ext>. No hash -> no year TTL.
            if find "$SITE_DIR/assets" -type f |
              grep -Ev -- '-[0-9A-Za-z_-]{8,}\.[^./]+$'
            then
              echo "Every immutable asset needs a content hash in its filename" >&2
              exit 1
            fi

            aws s3 cp "$SITE_DIR/assets/" "s3://$S3_BUCKET/assets/" \
              --recursive \
              --cache-control "public,max-age=31536000,immutable"
          fi

          # Remove keys absent from the artifact (delete-only in practice).
          aws s3 sync "$SITE_DIR/" "s3://$S3_BUCKET/" --delete

      - name: Revalidate the mutable entry point
        id: invalidate
        run: |
          set -euo pipefail
          invalidation_id="$(
            aws cloudfront create-invalidation \
              --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
              --paths "/index.html" \
              --query "Invalidation.Id" \
              --output text
          )"
          echo "id=$invalidation_id" >> "$GITHUB_OUTPUT"
          aws cloudfront wait invalidation-completed \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --id "$invalidation_id"

      - name: Report deployment
        uses: ./.github/actions/deploy-summary
        with:
          commit-sha: ${{ github.sha }}
          commit-message: ${{ github.event.head_commit.message || 'No commit message' }}
          site-directory: dist
          target: ${{ env.SITE_URL }}

      - name: Verify live state
        run: curl --fail --silent --show-error "https://$SITE_URL" | grep --fixed-strings "Deployed by GitHub Actions"
