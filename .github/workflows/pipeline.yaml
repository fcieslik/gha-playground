name: Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: dist
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: build
          path: dist
      - run: grep "Deployed by GitHub Actions" dist/index.html
      - run: 'echo "SIMULATION: would sync dist/ to S3 here (lesson 6)"'
      - name: Report
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          {
            echo "### Simulated deploy"
            echo "- **Commit:** ${{ github.sha }}"
            echo "- **Message:** $COMMIT_MSG"
            echo "- **Files in dist/:** $(find dist -type f | wc -l)"
          } >> "$GITHUB_STEP_SUMMARY"
