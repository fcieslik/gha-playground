name: Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_ACCOUNT_ID: "427047664719"
  AWS_REGION: us-east-1
  S3_BUCKET: my-frontend-app-assets-1
  SITE_URL: d26gkersxsxx1f.cloudfront.net
  CLOUDFRONT_DISTRIBUTION_ID: E9NDK1GEGISTX

jobs:
  ci:
    name: ci
    uses: ./.github/workflows/ci.yaml

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          name: build
          path: dist
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Show machine identity
        run: aws sts get-caller-identity

      - name: Deploy tested artifact
        run: aws s3 sync dist/ "s3://$S3_BUCKET/" --delete --exact-timestamps

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"

      - name: Report deployment
        uses: ./.github/actions/deploy-summary
        with:
          commit-sha: ${{ github.sha }}
          commit-message: ${{ github.event.head_commit.message || 'No commit message' }}
          site-directory: dist
          target: ${{ env.SITE_URL }}

      - name: Verify live state
        run: curl --fail --silent --show-error "https://$SITE_URL" | grep --fixed-strings "Deployed by GitHub Actions"
