name: Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Workflow-level: only supersede stale PR runs. Pushes get a per-run group
# (run_id appended) so two deploys never queue before their deploy job does.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.run_id || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_ACCOUNT_ID: "427047664719"
  AWS_REGION: us-east-1
  S3_BUCKET: my-frontend-app-assets-1
  SITE_URL: d26gkersxsxx1f.cloudfront.net
  CLOUDFRONT_DISTRIBUTION_ID: E9NDK1GEGISTX

jobs:
  ci:
    name: ci
    uses: ./.github/workflows/ci.yaml

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ci]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.CLOUDFRONT_URL }}
    # Serialize the shared production mutation: one deploy touches S3/CloudFront
    # at a time. A running deploy must finish (never cancelled mid-upload).
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: build
          path: dist
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: gha-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Show machine identity
        run: aws sts get-caller-identity

      - name: Publish release with explicit cache metadata
        env:
          SITE_DIR: dist
        run: |
          set -euo pipefail

          # Fail before any upload if an asset lacks a content hash in its name.
          # Vite fingerprint contract: <name>-<8+ base64 hash>.<ext>.
          if test -d "$SITE_DIR/assets" &&
            find "$SITE_DIR/assets" -type f |
              grep -Ev -- '-[0-9A-Za-z_-]{8,}\.[^./]+$'
          then
            echo "Every immutable asset needs a content hash in its filename" >&2
            exit 1
          fi

          # 1. Bulk upload + remove keys absent from the artifact. This pass may
          #    (re)write objects WITHOUT cache metadata, so it must run FIRST.
          aws s3 sync "$SITE_DIR/" "s3://$S3_BUCKET/" --delete

          # 2. Cache metadata is set LAST so the last writer wins, regardless of
          #    how sync's second-granularity mtime compare decides to re-upload.
          #    Mutable entry point: same URL, new release -> revalidate every request.
          aws s3 cp "$SITE_DIR/" "s3://$S3_BUCKET/" \
            --recursive \
            --exclude "*" \
            --include "*.html" \
            --cache-control "public,max-age=0,s-maxage=0,must-revalidate"

          # Immutable assets: changed bytes produce a changed URL, so cache a year.
          if test -d "$SITE_DIR/assets"; then
            aws s3 cp "$SITE_DIR/assets/" "s3://$S3_BUCKET/assets/" \
              --recursive \
              --cache-control "public,max-age=31536000,immutable"
          fi

      - name: Revalidate the mutable entry point
        id: invalidate
        run: |
          set -euo pipefail
          invalidation_id="$(
            aws cloudfront create-invalidation \
              --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
              --paths "/index.html" \
              --query "Invalidation.Id" \
              --output text
          )"
          echo "id=$invalidation_id" >> "$GITHUB_OUTPUT"
          aws cloudfront wait invalidation-completed \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --id "$invalidation_id"

      - name: Prove the freshness contract reached the origin
        run: |
          set -euo pipefail
          html_cc="$(aws s3api head-object \
            --bucket "$S3_BUCKET" --key index.html \
            --query CacheControl --output text)"
          echo "index.html Cache-Control: $html_cc"
          case "$html_cc" in
            *max-age=0*) ;;
            *) echo "index.html is missing the zero-age policy" >&2; exit 1;;
          esac

      - name: Report deployment
        uses: ./.github/actions/deploy-summary
        with:
          commit-sha: ${{ github.sha }}
          commit-message: ${{ github.event.head_commit.message || 'No commit message' }}
          site-directory: dist
          target: ${{ env.SITE_URL }}

      - name: Verify live state
        run: curl --fail --silent --show-error "https://$SITE_URL" | grep --fixed-strings "Deployed by GitHub Actions"
